name: Local Java Assistant
version: 1.0.0
schema: v1

models:
  - name: Java Coder 7B
    provider: ollama
    model: qwen2.5-coder:7b
    apiBase: http://localhost:11434
    capabilities:
      - tool_use
    roles:
      - chat
      - edit
      - apply
      # Apply the suggested edit to search for Java files in all directories
      - name: file_glob_search
        arguments:
          pattern: "**/*.java"

tabAutocompleteModel:
  name: Qwen Coder 1.5B
  provider: ollama
  model: qwen2.5-coder:1.5b
  apiBase: http://localhost:11434

embeddingsProvider:
  provider: ollama
  model: nomic-embed-text
  apiBase: http://localhost:11434
