<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>

<main class="container page-container">

<div class="row justify-content-center">
    <div class="col-md-5">

        <div class="card">
            <div class="card-body">

                <h3 class="mb-3">Вхід до системи</h3>

                <div th:if="${param.error}" class="alert alert-danger">
                    Невірний логін або пароль.
                </div>

                <div th:if="${param.pending}" class="alert alert-warning">
                    Ваш обліковий запис ще не підтверджено адміністратором.
                </div>

                <div th:if="${param.registered}" class="alert alert-success">
                    Реєстрацію надіслано. Очікуйте підтвердження адміністратора.
                </div>

                <div th:if="${param.logout}" class="alert alert-info">
                    Ви вийшли із системи.
                </div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Логін</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Увійти
                    </button>
                </form>

<!--                <form th:action="@{/login}" method="post">-->
<!--                    <input type="hidden"-->
<!--                           th:name="${_csrf.parameterName}"-->
<!--                           th:value="${_csrf.token}">-->

<!--                    <input type="text" name="username" class="form-control">-->
<!--                    <input type="password" name="password" class="form-control">-->

<!--                    <button type="submit" class="btn btn-primary">Увійти</button>-->
<!--                </form>-->

                <div class="mt-3">
                    <a href="/register">Створити обліковий запис</a>
                </div>

            </div>
        </div>

    </div>
</div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script src="/js/language.js"></script>
</body>
</html>
