<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Шаблони звітів</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>

<nav th:replace="~{fragments/layout :: header(true, '/')}"></nav>

<main class="container page-container">

<h2>Шаблони звітів</h2>

<div class="mb-3">
    <a href="/templates/upload" class="btn btn-primary">Додати шаблон</a>
</div>

<div th:if="${#lists.isEmpty(templates)}" class="alert alert-info">
    Шаблони ще не додані.
</div>

<table th:if="${!#lists.isEmpty(templates)}" class="table table-bordered">
    <thead>
    <tr>
        <th>ID</th>
        <th>Назва</th>
        <th>Опис</th>
        <th>Тип</th>
        <th>Дата створення</th>
        <th>Дії</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="template : ${templates}">
        <td th:text="${template.id}"></td>
        <td th:text="${template.name}"></td>
        <td th:text="${template.description}"></td>
        <td th:text="${template.type}"></td>
        <td th:text="${template.createdAt}"></td>
        <td>
            <a th:href="@{/reports/generate/{id}(id=${template.id})}" class="btn btn-sm btn-success">Використати</a>
<!--            <a th:href="@{/templates/delete/{id}(id=${template.id})}" class="btn btn-sm btn-danger"-->
<!--               onclick="return confirm('Видалити шаблон?')">Видалити</a>-->
            <form th:action="@{/templates/delete/{id}(id=${template.id})}"
                  method="post"
                  sec:authorize="hasRole('ADMIN')"
                  onsubmit="return confirm('Видалити шаблон?')">
                <button type="submit" class="btn btn-sm btn-danger">
                    Видалити
                </button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script src="/js/language.js"></script>
</body>
</html>
