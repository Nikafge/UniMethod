<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="uk">
<body>

<th:block th:fragment="styles">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="/css/app.css" rel="stylesheet">
</th:block>

<nav th:fragment="header(showBack, backHref)" class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid px-4">
        <div class="d-flex align-items-center gap-3">
            <a th:if="${showBack}"
               th:href="${backHref}"
               class="btn btn-light btn-sm nav-btn"
               data-i18n="back">
                Назад
            </a>

            <a href="/" class="navbar-brand text-decoration-none" data-i18n="brand">
                Облік методичних публікацій
            </a>
        </div>

        <div class="d-flex align-items-center">
            <a href="/publications" class="btn btn-light btn-sm nav-btn me-2" data-i18n="navPublications">
                Усі публікації
            </a>
            <a href="/templates" class="btn btn-light btn-sm nav-btn me-2" data-i18n="navTemplates">
                Шаблони
            </a>
            <a href="/reports" class="btn btn-warning btn-sm nav-btn me-2" data-i18n="navReports">
                Звіт Word
            </a>
            <a sec:authorize="hasRole('ADMIN')"
               href="/admin"
               class="btn btn-light btn-sm nav-btn me-2"
               data-i18n="navAdmin">
                Адміністрування
            </a>

            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline me-2">
                <button type="submit" class="btn btn-danger btn-sm nav-btn" data-i18n="logout">
                    Вийти
                </button>
            </form>

            <div class="language-switch" role="group" aria-label="Language switch">
                <button type="button" data-lang-option="uk" class="active" aria-pressed="true">UA</button>
                <button type="button" data-lang-option="en" aria-pressed="false">EN</button>
            </div>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="footer text-center" data-i18n="footer">
    © 2026 Кафедра програмної інженерії та інформаційних технологій управління
</footer>

</body>
</html>
