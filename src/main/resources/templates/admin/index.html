<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Адміністрування</title>
  <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>
<body>

<nav th:replace="~{fragments/layout :: header(true, '/')}"></nav>

<main class="container page-container">

<h2>Панель адміністратора</h2>

<div class="card mb-4">
  <div class="card-body">

    <h4>Заявки на реєстрацію</h4>

    <div th:if="${#lists.isEmpty(pendingUsers)}" class="alert alert-info">
      Немає заявок на реєстрацію.
    </div>

    <table th:if="${!#lists.isEmpty(pendingUsers)}" class="table table-bordered">
      <thead>
      <tr>
        <th>ID</th>
        <th>Ім'я</th>
        <th>Прізвище</th>
        <th>Логін</th>
        <th>Email</th>
        <th>Дата заявки</th>
        <th>Дії</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="user : ${pendingUsers}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.firstName}"></td>
        <td th:text="${user.lastName}"></td>
        <td th:text="${user.username}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${user.createdAt}"></td>
        <td class="d-flex gap-2">
          <form th:action="@{/admin/users/{id}/approve(id=${user.id})}" method="post">
            <button type="submit" class="btn btn-sm btn-success">
              Підтвердити
            </button>
          </form>

          <form th:action="@{/admin/users/{id}/reject(id=${user.id})}" method="post">
            <button type="submit" class="btn btn-sm btn-warning">
              Відхилити
            </button>
          </form>

          <form th:action="@{/admin/users/{id}/delete(id=${user.id})}" method="post"
                onsubmit="return confirm('Видалити користувача?')">
            <button type="submit" class="btn btn-sm btn-danger">
              Видалити
            </button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>

  </div>
</div>

<div class="card mb-4">
  <div class="card-body">

    <h4>Активні викладачі</h4>

    <div th:if="${#lists.isEmpty(activeTeachers)}" class="alert alert-info">
      Активних викладачів поки немає.
    </div>

    <table th:if="${!#lists.isEmpty(activeTeachers)}" class="table table-bordered">
      <thead>
      <tr>
        <th>ID</th>
        <th>Ім'я</th>
        <th>Прізвище</th>
        <th>Логін</th>
        <th>Email</th>
        <th>Статус</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="user : ${activeTeachers}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.firstName}"></td>
        <td th:text="${user.lastName}"></td>
        <td th:text="${user.username}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${user.status}"></td>
      </tr>
      </tbody>
    </table>

  </div>
</div>

<div class="card">
  <div class="card-body">

    <h4>Усі облікові записи</h4>

    <table class="table table-bordered">
      <thead>
      <tr>
        <th>ID</th>
        <th>Ім'я</th>
        <th>Прізвище</th>
        <th>Логін</th>
        <th>Email</th>
        <th>Роль</th>
        <th>Статус</th>
        <th>Змінити статус</th>
        <th>Дії</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="user : ${allUsers}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.firstName}"></td>
        <td th:text="${user.lastName}"></td>
        <td th:text="${user.username}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${user.role}"></td>
        <td th:text="${user.status}"></td>
        <td>
          <form th:action="@{/admin/users/{id}/status(id=${user.id})}"
                method="post"
                class="d-flex gap-2">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <select name="status" class="form-select form-select-sm">
              <option th:each="statusValue : ${statuses}"
                      th:value="${statusValue}"
                      th:text="${statusValue}"
                      th:selected="${statusValue == user.status}">
              </option>
            </select>

            <button type="submit" class="btn btn-sm btn-primary">
              Зберегти
            </button>
          </form>
        </td>

        <td>
          <form th:action="@{/admin/users/{id}/delete(id=${user.id})}"
                method="post"
                onsubmit="return confirm('Видалити цей обліковий запис?')">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <button type="submit"
                    class="btn btn-sm btn-danger"
                    th:disabled="${user.role.name() == 'ADMIN'}">
              Видалити
            </button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>

  </div>
</div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script src="/js/language.js"></script>
</body>
</html>
