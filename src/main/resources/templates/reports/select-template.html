<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Генерація звіту</title>
    <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>

<body>

<nav th:replace="~{fragments/layout :: header(true, '/reports')}"></nav>

<main class="container page-container">

<h2>Генерація звіту</h2>

<p>Оберіть шаблон звіту:</p>

<table class="table table-bordered">

    <tr>
        <th>ID</th>
        <th>Назва</th>
        <th>Тип</th>
        <th>Дія</th>
    </tr>

    <tr th:each="t : ${templates}">

        <td th:text="${t.id}"></td>
        <td th:text="${t.name}"></td>
        <td th:text="${t.type}"></td>

        <td>
            <a th:href="@{/reports/generate/{id}(id=${t.id})}">
                Використати
            </a>
        </td>

    </tr>

</table>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script src="/js/language.js"></script>
</body>
</html>
