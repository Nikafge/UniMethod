<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="uk">

<head>
  <meta charset="UTF-8">
  <title>Згенеровані звіти</title>
  <th:block th:replace="~{fragments/layout :: styles}"></th:block>
</head>

<body>

<nav th:replace="~{fragments/layout :: header(true, '/reports')}"></nav>

<main class="container page-container">

<h2>Згенеровані звіти</h2>

<a href="/reports/new" class="btn btn-primary">
  Створити новий звіт
</a>

<br><br>

<table class="table table-bordered">

  <tr>
    <th>ID</th>
    <th>Назва</th>
    <th>Дата створення</th>
    <th>Дії</th>
  </tr>

  <tr th:each="report : ${reports}">

    <td th:text="${report.id}"></td>

    <td th:text="${report.name}"></td>

    <td th:text="${report.createdAt}"></td>

    <td>

      <a th:href="@{/reports/download/{id}(id=${report.id})}">
        Завантажити
      </a>

    </td>
    <form th:action="@{/reports/delete/{id}(id=${report.id})}"
          method="post"
          sec:authorize="hasRole('ADMIN')"
          onsubmit="return confirm('Видалити звіт?')">
      <button type="submit" class="btn btn-sm btn-danger">
        Видалити
      </button>
    </form>

  </tr>

</table>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script src="/js/language.js"></script>
</body>
</html>
